<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EntityScholar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="logo-section">
          <img src="../icons/icon48.png" alt="EntityScholar" class="logo">
          <h1 class="title">EntityScholar</h1>
        </div>
        <button class="settings-btn" id="settingsBtn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M17.43 10.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C12.46.22 12.25 0 12 0h-4c-.25 0-.46.22-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.2.24.42.49.42h4c.25 0 .46-.22.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM10 13c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3z"/>
          </svg>
        </button>
      </div>

      <div class="page-info" id="pageInfo">
        <span class="page-title" id="pageTitle">Loading...</span>
      </div>
    </header>

    <!-- Scan Button -->
    <div class="scan-section">
      <button class="scan-btn" id="scanBtn">
        <span class="btn-icon">🔍</span>
        <span class="btn-text">Scan This Page</span>
      </button>

      <div class="scan-status" id="scanStatus"></div>
      <div class="auto-scan-indicator" id="autoScanIndicator"></div>
    </div>

    <!-- Entities Section -->
    <div class="entities-section" id="entitiesSection">
      <div class="entities-header" id="entitiesHeader">
        <h2 class="entities-title">Found <span id="entityCount">0</span> entities</h2>
        <span class="scan-timestamp" id="scanTimestamp"></span>
      </div>

      <div class="entities-list" id="entitiesList">
        <!-- Entities will be dynamically added here -->
      </div>

      <div class="no-entities" id="noEntities">
        Click "Scan This Page" to analyze entities
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p>Analyzing page content...</p>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage">
      <span class="error-icon">⚠</span>
      <span class="error-text" id="errorText"></span>
      <button class="error-close" id="errorClose">×</button>
    </div>

    <!-- API Key Setup Prompt -->
    <div class="setup-prompt" id="setupPrompt">
      <div class="setup-icon">🔑</div>
      <h3>API Key Required</h3>
      <p>To use EntityScholar, you need a Google Cloud Natural Language API key.</p>
      <button class="setup-btn" id="setupBtn">Configure API Key</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
