<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EntityScholar Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px;
    }
    .canvas-container {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    button:hover {
      background: #1557b0;
    }
    .instructions {
      background: #f1f3f4;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>EntityScholar Icon Generator</h1>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click "Generate Icons" button below</li>
      <li>Right-click each icon and "Save image as..."</li>
      <li>Save as icon16.png, icon48.png, and icon128.png respectively</li>
      <li>Place the files in the /icons directory</li>
    </ol>
  </div>

  <button onclick="generateIcons()">Generate Icons</button>

  <div class="canvas-container">
    <div>
      <div>16x16</div>
      <canvas id="icon16" width="16" height="16"></canvas>
      <br>
      <button onclick="downloadIcon('icon16', 16)">Download 16x16</button>
    </div>
    <div>
      <div>48x48</div>
      <canvas id="icon48" width="48" height="48"></canvas>
      <br>
      <button onclick="downloadIcon('icon48', 48)">Download 48x48</button>
    </div>
    <div>
      <div>128x128</div>
      <canvas id="icon128" width="128" height="128"></canvas>
      <br>
      <button onclick="downloadIcon('icon128', 128)">Download 128x128</button>
    </div>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');

      // Background circle
      ctx.fillStyle = '#1a73e8';
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Inner white circle
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2.5, 0, Math.PI * 2);
      ctx.fill();

      // ES text
      ctx.fillStyle = '#1a73e8';
      ctx.font = `bold ${size / 2.5}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ES', size / 2, size / 2);
    }

    function generateIcons() {
      drawIcon(document.getElementById('icon16'), 16);
      drawIcon(document.getElementById('icon48'), 48);
      drawIcon(document.getElementById('icon128'), 128);
    }

    function downloadIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const url = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = url;
      link.click();
    }

    // Generate on load
    window.addEventListener('load', generateIcons);
  </script>
</body>
</html>
